<style>

*{margin:0;padding:0;box-sizing:border-box;font-family:'Cairo','Plus Jakarta Sans',sans-serif}h1,h2,h3{font-family:'Cairo','Space Grotesk',sans-serif}
body{background:var(--bg);color:var(--txt)}html[dir="ltr"] *{font-family:'Plus Jakarta Sans',sans-serif}html[dir="ltr"] h1,html[dir="ltr"] h2,html[dir="ltr"] h3{font-family:'Space Grotesk',sans-serif}
.wrap{max-width:1000px;margin:auto;padding:0 22px 60px}
.crumb{margin:22px 0 12px;font-size:.85rem;color:var(--mut)}.crumb a{color:var(--teal);text-decoration:none}
.heroimg{border-radius:20px;overflow:hidden;border:1px solid var(--border);position:relative;min-height:min(420px,52vw);height:min(420px,52vw);background:#050D17;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:10px;padding:24px;text-align:center}.heroimg-logo{position:absolute;inset:0;margin:auto;width:40%;max-width:220px;opacity:.18;pointer-events:none;z-index:0;object-fit:contain}.heroimg-site{position:relative;z-index:2;font-size:.75rem;font-weight:800;letter-spacing:.2em;color:#FFFFFF;opacity:.85}.heroimg-title{position:relative;z-index:2;font-size:clamp(1.3rem,3vw,2rem);font-weight:800;color:#FFFFFF;line-height:1.35;text-shadow:0 2px 12px rgba(0,0,0,.5);max-width:100%}.heroimg-domain{position:relative;z-index:2;font-size:.78rem;color:#FFFFFF;opacity:.75}.heroimg::before,.heroimg::after{content:'';position:absolute;pointer-events:none;z-index:1}.heroimg::before{bottom:0;inset-inline-end:0;width:90px;height:90px;background:#F6AC4F;clip-path:polygon(100% 0,0 100%,100% 100%);opacity:.3}.heroimg::after{top:10px;inset-inline-start:10px;width:60px;height:60px;border:2px solid #C3673D;opacity:.35;transform:rotate(45deg)}
.body{background:var(--card);border:1px solid var(--border);border-radius:20px;padding:clamp(20px,4vw,42px);margin-top:-44px;position:relative;box-shadow:var(--shadow)}
.meta{display:flex;gap:8px;font-size:.78rem;color:var(--mut);flex-wrap:wrap}.cat{background:var(--badge);color:var(--teal);border:1px solid var(--border);padding:4px 12px;border-radius:999px;font-weight:800}
.body h1{font-size:clamp(1.35rem,3.4vw,2.1rem);line-height:1.6;margin:12px 0 6px}.lede{color:var(--mut);font-size:1rem;line-height:2;border-inline-start:3px solid var(--teal);padding-inline-start:14px;margin:14px 0 20px}
.body p.p{line-height:2.05;margin-bottom:15px}.body h2{color:var(--teal);margin:26px 0 12px;font-size:1.2rem}
.quote{background:var(--badge);border:1px dashed var(--border-h);border-radius:14px;padding:18px;margin:20px 0;font-weight:700;line-height:1.9}
.points{list-style:none;display:flex;flex-direction:column;gap:10px}.points li{background:var(--bg);border:1px solid var(--border);border-radius:12px;padding:12px 16px;line-height:1.8}
.authorbox{display:flex;gap:12px;align-items:center;background:var(--bg);border:1px solid var(--border);border-radius:14px;padding:14px 16px;margin-top:24px}.authorbox img{width:52px;height:52px;border-radius:50%;object-fit:cover;border:2px solid var(--teal)}
.rel{display:grid;grid-template-columns:repeat(auto-fill,minmax(260px,1fr));gap:16px;margin-top:14px}.rel .card{background:var(--bg);border:1px solid var(--border);border-radius:14px;overflow:hidden}.rel-cover{width:100%;height:140px;position:relative;overflow:hidden;background:#050D17;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:6px;padding:12px;text-align:center}.rel-cover-logo{position:absolute;inset:0;margin:auto;width:46%;max-width:120px;opacity:.18;pointer-events:none;z-index:0;object-fit:contain}.rel-cover-site{position:relative;z-index:2;font-size:.62rem;font-weight:800;letter-spacing:.18em;color:#FFFFFF;opacity:.85}.rel-cover-title{position:relative;z-index:2;font-size:.85rem;font-weight:800;color:#FFFFFF;line-height:1.4;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden;max-width:100%;text-shadow:0 2px 6px rgba(0,0,0,.4)}.rel-cover-domain{position:relative;z-index:2;font-size:.65rem;color:#FFFFFF;opacity:.75}.rel-cover::before,.rel-cover::after{content:'';position:absolute;pointer-events:none;z-index:1}.rel-cover::before{bottom:0;inset-inline-end:0;width:44px;height:44px;background:#F6AC4F;clip-path:polygon(100% 0,0 100%,100% 100%);opacity:.3}.rel-cover::after{top:6px;inset-inline-start:6px;width:28px;height:28px;border:2px solid #C3673D;opacity:.35;transform:rotate(45deg)}.rel-cover-title{font-size:.88rem;font-weight:800;color:var(--txt);text-shadow:0 2px 8px rgba(0,0,0,.5);display:-webkit-box;-webkit-line-clamp:3;-webkit-box-orient:vertical;overflow:hidden}.rel div.b{padding:14px}.rel a{color:var(--teal);font-weight:800;font-size:.85rem;text-decoration:none}
.cta-box{background:linear-gradient(135deg,rgba(246,172,79,.12),rgba(195,103,61,.08));border:1px solid var(--border-h);border-radius:16px;padding:22px;text-align:center;margin-top:26px;line-height:2}
.cta-box .btn{margin-top:10px}
</style>

<body>
<div id="tw4a-chrome-header"></div>
<main id="tw4a-main" tabindex="-1" class="wrap">

<div class="heroimg"><img class="heroimg-logo" src="images/logo.png" alt="" aria-hidden="true"><span class="heroimg-site">TOPWEB4ALL</span><span class="heroimg-title" id="coverTitle"></span><span class="heroimg-domain">topweb4all.dev</span></div>

<script src="assets/chrome.js"></script>
<script src="data/articles.js"></script>
<script>
const CATL={en:{brand:'Branding',web:'Web',email:'Emails',auto:'Automation',qa:'QA',launch:'Launch'},ar:{brand:'البراند',web:'المواقع',email:'الإيميلات',auto:'الأتمتة',qa:'الجودة',launch:'الإطلاق'}};
let lang=localStorage.getItem('tw4a-lang')||'ar';
const id=new URLSearchParams(location.search).get('id');
const a=(window.TW4A_ARTICLES||[]).find(x=>x.slug===id)||(window.TW4A_ARTICLES||[])[0];
function render(){document.documentElement.lang=lang;document.documentElement.dir=lang==='ar'?'rtl':'ltr';if(!a){document.getElementById('title').textContent=lang==='ar'?'المقال غير موجود':'Article not found';return}
var T=(lang==='ar'?a.title_ar:a.title_en), X=(lang==='ar'?a.excerpt_ar:a.excerpt_en);
document.getElementById('docTitle').textContent=T+' | TOPWEB4ALL';
function setMeta(sel,val,attr){var el=document.querySelector(sel);if(el)el.setAttribute(attr||'content',val)}
setMeta('meta[name="description"]',X);setMeta('meta[property="og:title"]',T);setMeta('meta[property="og:description"]',X);
setMeta('meta[name="twitter:title"]',T);setMeta('meta[name="twitter:description"]',X);
setMeta('meta[property="og:image"]',location.origin+location.pathname.replace(/[^/]*$/,'')+a.cover,false);
setMeta('link[rel="canonical"]',location.origin+location.pathname+'?id='+a.slug,'href');
setMeta('meta[property="og:url"]',location.origin+location.pathname+'?id='+a.slug);
setMeta('meta[property="og:type"]','article');
var ld=document.getElementById('ldjson'); if(ld){ld.textContent=JSON.stringify({'@context':'https://schema.org','@type':'BlogPosting',headline:T,description:X,image:[location.origin+location.pathname.replace(/[^/]*$/,'')+a.cover],inLanguage:lang,author:{'@type':'Person',name:lang==='ar'?'أمنية أحمد':'Omnia Ahmed',url:'https://www.linkedin.com/in/omniabdm/'},publisher:{'@type':'Organization',name:'TOPWEB4ALL',logo:{'@type':'ImageObject',url:location.origin+location.pathname.replace(/[^/]*$/,'')+'favicon-32x32.png'}},mainEntityOfPage:location.origin+location.pathname+'?id='+a.slug})}
document.getElementById('coverTitle').textContent=T;document.getElementById('meta').innerHTML=`<span class="cat">${CATL[lang][a.cat]}</span><span>${lang==='ar'?a.date_ar:a.date_en}</span>`;
document.getElementById('title').textContent=lang==='ar'?a.title_ar:a.title_en;document.getElementById('lede').textContent=lang==='ar'?a.excerpt_ar:a.excerpt_en;
document.getElementById('content').innerHTML=(lang==='ar'?a.body_ar:a.body_en).map(p=>`<p class="p">${p}</p>`).join('');
document.getElementById('quote').textContent=lang==='ar'?a.quote_ar:a.quote_en;
document.getElementById('ptsH').textContent=lang==='ar'?'✅ أهم النقاط العملية':'✅ Key takeaways';
document.getElementById('pts').innerHTML=(lang==='ar'?a.points_ar:a.points_en).map(p=>`<li>✔ ${p}</li>`).join('');
document.getElementById('auN').textContent=lang==='ar'?'أمنية أحمد — مؤسِّسة TOPWEB4ALL':'Omnia Ahmed — Founder of TOPWEB4ALL';
document.getElementById('auS').textContent=lang==='ar'?'مطوِّرة ويب ومختبِرة جودة — خبرة 5 سنوات':'Web developer & QA tester — 5 years experience';
var __bb=document.getElementById('backBtn'); if(__bb) __bb.textContent=lang==='ar'?'→ المقالات':'→ Articles';
document.getElementById('ctaT').textContent=lang==='ar'?'عايزة تنفذي ده في مشروعك؟':'Want this implemented in your project?';
document.getElementById('ctaS').textContent=lang==='ar'?'احجزي مكالمة مجانية — نرد خلال 24 ساعة عمل':'Book a free call — reply within 24 business hours';
document.getElementById('ctaB').textContent=lang==='ar'?'ابدأي مشروعك ←':'Start your project →';document.getElementById('crumbBlog').textContent=lang==='ar'?'المدونة':'Blog';document.getElementById('crumbNow').textContent=lang==='ar'?a.title_ar:a.title_en;document.getElementById('relH').textContent=lang==='ar'?'📚 مقالات ذات صلة':'📚 Related articles';
const rel=(window.TW4A_ARTICLES||[]).filter(x=>x.slug!==a.slug&&x.cat===a.cat).concat((window.TW4A_ARTICLES||[]).filter(x=>x.slug!==a.slug&&x.cat!==a.cat)).slice(0,3);
document.getElementById('rel').innerHTML=rel.map(r=>`<div class="card"><div class="rel-cover"><img class="rel-cover-logo" src="images/logo.png" alt="" aria-hidden="true"><span class="rel-cover-site">TOPWEB4ALL</span><span class="rel-cover-title">${lang==='ar'?r.title_ar:r.title_en}</span><span class="rel-cover-domain">topweb4all.dev</span></div><div class="b"><b style="font-size:.92rem">${lang==='ar'?r.title_ar:r.title_en}</b><br><a href="article.html?id=${r.slug}">${lang==='ar'?'اقرأ ←':'Read →'}</a></div></div>`).join('');}


document.documentElement.dataset.theme=localStorage.getItem('tw4a-theme')||'dark';TW4A_CHROME.init({active:'blog'});window.applyLang=function(l){lang=l;render();};render();
</script>
