<!DOCTYPE html>
<html lang="ar" dir="rtl" data-theme="dark">
<head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="description" content="دراسات حالة مشاريع TOPWEB4ALL: النطاق، التقنيات، النتائج وآراء العملاء.">
<link rel="canonical" href="https://topweb4all.dev/project.html">
<link rel="icon" type="image/svg+xml" href="favicon.svg">
<link rel="icon" type="image/png" sizes="32x32" href="favicon-32x32.png">
<link rel="icon" type="image/png" sizes="16x16" href="favicon-16x16.png">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<link rel="manifest" href="site.webmanifest">
<meta property="og:type" content="website">
<meta property="og:title" content="مشروع | TOPWEB4ALL">
<meta property="og:description" content="دراسات حالة مشاريع TOPWEB4ALL: النطاق، التقنيات، النتائج وآراء العملاء.">
<meta property="og:url" content="https://topweb4all.dev/project.html">
<meta property="og:image" content="https://topweb4all.dev/images/og-cover.jpg">
<meta name="twitter:image" content="https://topweb4all.dev/images/og-cover.jpg">
<meta name="twitter:card" content="summary_large_image">
<title id="docTitle">مشروع | TOPWEB4ALL</title>
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;600;700&family=Space+Grotesk:wght@600;700;800&family=Cairo:wght@400;600;700;800&display=swap" rel="stylesheet">
<link rel="stylesheet" href="assets/chrome.css">
<style>
:root{--teal:#00F2FE;--teal-deep:#00A896;--bg:#050D17;--card:rgba(11,24,38,.78);--header:rgba(5,13,23,.94);--border:rgba(0,242,254,.16);--border-h:rgba(0,242,254,.55);--txt:#fff;--mut:#8E9FB5;--badge:rgba(0,242,254,.08);--shadow:0 14px 40px rgba(0,0,0,.45)}
[data-theme="light"]{--bg:#EDF4F6;--card:#fff;--header:rgba(255,255,255,.96);--border:rgba(2,128,144,.28);--border-h:#028090;--txt:#0A1B29;--mut:#3D5468;--badge:rgba(2,128,144,.12);--shadow:0 12px 32px rgba(10,60,75,.14);--teal:#028090}
*{margin:0;padding:0;box-sizing:border-box;font-family:'Cairo','Plus Jakarta Sans',sans-serif}h1,h2,h3{font-family:'Cairo','Space Grotesk',sans-serif}
body{background:var(--bg);color:var(--txt)}html[dir="ltr"] *{font-family:'Plus Jakarta Sans',sans-serif}html[dir="ltr"] h1,html[dir="ltr"] h2,html[dir="ltr"] h3{font-family:'Space Grotesk',sans-serif}
.wrap{max-width:1100px;margin:auto;padding:0 22px 60px}.crumb{margin:22px 0 12px;font-size:.85rem;color:var(--mut)}.crumb a{color:var(--teal);text-decoration:none}
.dhero{border-radius:20px;overflow:hidden;border:1px solid var(--border);position:relative}.dhero img{width:100%;height:min(430px,52vw);object-fit:cover;display:block}.dhero .over{position:absolute;bottom:0;inset-inline:0;padding:26px;background:linear-gradient(transparent,rgba(2,10,18,.88));color:#fff}
.dhero h1{font-size:clamp(1.35rem,3.4vw,2.1rem);line-height:1.6}.pill{background:rgba(0,242,254,.16);border:1px solid var(--border-h);color:#fff;padding:4px 13px;border-radius:999px;font-size:.76rem;font-weight:800}
.dcard{background:var(--card);border:1px solid var(--border);border-radius:18px;padding:clamp(20px,3.5vw,36px);margin-top:18px;box-shadow:var(--shadow)}
.dcard h2{color:var(--teal);margin:24px 0 10px;font-size:1.18rem}.dcard h2:first-child{margin-top:0}.dcard p{line-height:2;font-size:.97rem;margin-bottom:10px}
.kv{display:grid;grid-template-columns:repeat(auto-fit,minmax(170px,1fr));gap:12px;margin:14px 0}.kv div{background:var(--bg);border:1px solid var(--border);border-radius:12px;padding:12px 15px}.kv small{color:var(--mut);font-size:.76rem;display:block}.pills{display:flex;gap:8px;flex-wrap:wrap}.pill2{background:var(--badge);border:1px solid var(--border);color:var(--teal);font-size:.78rem;font-weight:700;padding:5px 13px;border-radius:999px}
.gal{display:grid;grid-template-columns:repeat(auto-fit,minmax(200px,1fr));gap:12px}.gal img{width:100%;height:170px;object-fit:cover;border-radius:12px;border:1px solid var(--border)}
.testi{background:var(--badge);border:1px dashed var(--border-h);border-radius:14px;padding:18px;line-height:1.9;margin-top:10px}
.cta{display:flex;gap:10px;flex-wrap:wrap;margin-top:22px}
.rel{display:grid;grid-template-columns:repeat(auto-fill,minmax(280px,1fr));gap:16px;margin-top:12px}.rel .card{background:var(--bg);border:1px solid var(--border);border-radius:14px;overflow:hidden}.rel img{width:100%;height:150px;object-fit:cover}.rel div.b{padding:14px}.rel a{color:var(--teal);font-weight:800;font-size:.85rem;text-decoration:none}
</style>
</head>
<body>
<div id="tw4a-chrome-header"></div>
<main id="tw4a-main" tabindex="-1" class="wrap">
<nav class="crumb" aria-label="Breadcrumb"><a href="Topweb4all.html" data-i18n="bcHome">الرئيسية</a> / <a href="projects.html" id="crumbW">المشاريع</a> / <span id="crumbNow" aria-current="page">…</span></nav>
<div class="dhero"><img id="cover" src="" alt="" width="1000" height="560" decoding="async"><div class="over"><span class="pill" id="cats"></span><h1 id="title"></h1><small id="meta"></small></div></div>
<div class="dcard">
<div class="kv" id="kv"></div>
<h2 id="hOv">📌 نظرة عامة</h2><p id="ov"></p>
<h2 id="hCh">🎯 التحدي والحل</h2><p id="ch"></p>
<h2>🛠️ Tech Stack</h2><div class="pills" id="stack"></div>
<h2 id="hSvc">🔗 خدمات مرتبطة</h2><div class="pills" id="svc"></div>
<h2 id="hRes">📈 النتائج</h2><div class="kv" id="res"></div>
<h2 id="hGal">🖼️ معرض الصور</h2><div class="gal" id="gal"></div>
<h2 id="hTs">💬 رأي العميل</h2><div class="testi" id="testi"></div>
<div class="cta"><a class="btn btn-primary" href="Topweb4all.html#contact" id="cta1">ابدأ مشروعًا مشابهًا ←</a><a class="btn" href="projects.html" id="cta2">تصفح مشاريع أخرى</a></div>
<h2 id="hRel" style="margin-top:26px">🔗 مشاريع ذات صلة</h2><div class="rel" id="rel"></div>
</main></div>
<div id="tw4a-chrome-footer"></div>
<script type="application/ld+json" id="ldjson">{"@context":"https://schema.org","@type":"CreativeWork"}</script>
<script src="assets/chrome.js"></script>
<script src="data/projects.js"></script>
<script>
const CATL={en:{brand:'Branding',web:'Web',auto:'Automation',launch:'Launch'},ar:{brand:'البراند',web:'المواقع',auto:'الأتمتة',launch:'الإطلاق'}};
let lang=localStorage.getItem('tw4a-lang')||'ar';
const id=new URLSearchParams(location.search).get('id');
const p=(window.TW4A_PROJECTS||[]).find(x=>x.slug===id)||(window.TW4A_PROJECTS||[])[0];
function T(en,ar){return lang==='ar'?ar:en}
function render(){document.documentElement.lang=lang;document.documentElement.dir=lang==='ar'?'rtl':'ltr';if(!p)return;
var TI=T(p.title_en,p.title_ar), EX=T(p.excerpt_en,p.excerpt_ar);
document.getElementById('docTitle').textContent=TI+' | TOPWEB4ALL';
document.getElementById('cover').alt=TI;
function setMeta(sel,val,attr){var el=document.querySelector(sel);if(el)el.setAttribute(attr||'content',val)}
setMeta('meta[name="description"]',EX);setMeta('meta[property="og:title"]',TI);setMeta('meta[property="og:description"]',EX);
setMeta('meta[name="twitter:title"]',TI);setMeta('meta[name="twitter:description"]',EX);
setMeta('meta[property="og:image"]',location.origin+location.pathname.replace(/[^/]*$/,'')+p.cover);
setMeta('link[rel="canonical"]',location.origin+location.pathname+'?id='+p.slug,'href');
setMeta('meta[property="og:url"]',location.origin+location.pathname+'?id='+p.slug);
setMeta('meta[property="og:type"]','article');
var ld=document.getElementById('ldjson'); if(ld){ld.textContent=JSON.stringify({'@context':'https://schema.org','@type':'CreativeWork',name:TI,description:EX,image:[location.origin+location.pathname.replace(/[^/]*$/,'')+p.cover],inLanguage:lang,dateCreated:p.year,creator:{'@type':'Organization',name:'TOPWEB4ALL',url:'https://topweb4all.dev/'},about:p.stack,url:location.origin+location.pathname+'?id='+p.slug})}
document.getElementById('cover').src=p.cover;document.getElementById('cats').textContent=p.cats.map(c=>CATL[lang][c]).join(' • ');
document.getElementById('title').textContent=T(p.title_en,p.title_ar);
document.getElementById('meta').textContent=[T(p.client_en,p.client_ar),T(p.timeline_en,p.timeline_ar),p.year].join(' • ');
document.getElementById('crumbW').textContent=lang==='ar'?'المشاريع':'Work';document.getElementById('crumbNow').textContent=T(p.title_en,p.title_ar);var __bb=document.getElementById('backBtn'); if(__bb) __bb.textContent=lang==='ar'?'→ المشاريع':'→ Projects';
const L=lang==='ar'?{c:'العميل',t:'المدة',s:'النطاق',y:'السنة'}:{c:'Client',t:'Timeline',s:'Scope',y:'Year'};
document.getElementById('kv').innerHTML=`<div><small>${L.c}</small><b>${T(p.client_en,p.client_ar)}</b></div><div><small>${L.t}</small><b>${T(p.timeline_en,p.timeline_ar)}</b></div><div><small>${L.s}</small><b>${T(p.scope_en,p.scope_ar)}</b></div><div><small>${L.y}</small><b>${p.year}</b></div>`;
document.getElementById('ov').textContent=T(p.overview_en,p.overview_ar);document.getElementById('ch').textContent=T(p.challenge_en,p.challenge_ar);
document.getElementById('stack').innerHTML=p.stack.map(s=>`<span class="pill2">${s}</span>`).join('');
document.getElementById('res').innerHTML=p.stats.map(s=>`<div><small>${T(s.l_en,s.l_ar)}</small><b style="color:var(--teal);font-size:1.25rem">${s.v}</b></div>`).join('');
document.getElementById('gal').innerHTML=p.gallery.map((g,i)=>`<img loading="lazy" decoding="async" width="600" height="380" src="${g}" alt="${TI} — ${i+1}">`).join('');
document.getElementById('testi').textContent=T(p.testi_en,p.testi_ar);
document.getElementById('hOv').textContent=lang==='ar'?'📌 نظرة عامة':'📌 Overview';document.getElementById('hCh').textContent=lang==='ar'?'🎯 التحدي والحل':'🎯 Challenge & solution';document.getElementById('hRes').textContent=lang==='ar'?'📈 النتائج':'📈 Results';document.getElementById('hGal').textContent=lang==='ar'?'🖼️ معرض الصور':'🖼️ Gallery';document.getElementById('hTs').textContent=lang==='ar'?'💬 رأي العميل':'💬 Client words';
document.getElementById('hSvc').textContent=lang==='ar'?'🔗 خدمات مرتبطة':'🔗 Related services';
const SVC={brand:{id:'svc-brand'},web:{id:'svc-web'},auto:{id:'svc-automation'},launch:{id:'svc-launch'}};
const SVCLBL={en:{'svc-brand':'Brand Creation','svc-web':'Web Engineering','svc-automation':'Automation','svc-launch':'Project Launch'},ar:{'svc-brand':'تأسيس البراند','svc-web':'هندسة المواقع','svc-automation':'الأتمتة','svc-launch':'إطلاق المشروع'}};
const seen={}; const svcLinks=p.cats.filter(c=>SVC[c]).map(c=>SVC[c].id).filter(id=>!seen[id]&&(seen[id]=1));
document.getElementById('svc').innerHTML=svcLinks.map(id=>`<a class="pill2" style="text-decoration:none" href="Topweb4all.html#${id}">${SVCLBL[lang][id]} →</a>`).join('');document.getElementById('hRel').textContent=lang==='ar'?'🔗 مشاريع ذات صلة':'🔗 Related projects';
document.getElementById('cta1').textContent=lang==='ar'?'ابدأ مشروعًا مشابهًا ←':'Start a similar project →';document.getElementById('cta2').textContent=lang==='ar'?'تصفح مشاريع أخرى':'Browse other projects';
const rel=(window.TW4A_PROJECTS||[]).filter(x=>x.slug!==p.slug).slice(0,3);
document.getElementById('rel').innerHTML=rel.map(r=>`<div class="card"><img loading="lazy" src="${r.cover}" alt=""><div class="b"><b style="font-size:.92rem">${T(r.title_en,r.title_ar)}</b><br><a href="project.html?id=${r.slug}">${lang==='ar'?'عرض ←':'View →'}</a></div></div>`).join('');}


document.documentElement.dataset.theme=localStorage.getItem('tw4a-theme')||'dark';TW4A_CHROME.init({active:'work'});window.applyLang=function(l){lang=l;render();};render();
</script>
</body>
</html>
