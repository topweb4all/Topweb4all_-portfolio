<style>
:root{--teal:#00F2FE;--teal-deep:#00A896;--bg:#050D17;--card:rgba(11,24,38,.78);--header:rgba(5,13,23,.94);--border:rgba(0,242,254,.16);--border-h:rgba(0,242,254,.55);--txt:#fff;--mut:#8E9FB5;--badge:rgba(0,242,254,.08);--shadow:0 14px 40px rgba(0,0,0,.45)}
[data-theme="light"]{--bg:#EDF4F6;--card:#fff;--header:rgba(255,255,255,.96);--border:rgba(2,128,144,.28);--border-h:#028090;--txt:#0A1B29;--mut:#3D5468;--badge:rgba(2,128,144,.12);--shadow:0 12px 32px rgba(10,60,75,.14);--teal:#028090}
*{margin:0;padding:0;box-sizing:border-box;font-family:'Cairo','Plus Jakarta Sans',sans-serif}h1,h2,h3{font-family:'Cairo','Space Grotesk',sans-serif}
body{background:var(--bg);color:var(--txt)}html[dir="ltr"] *{font-family:'Plus Jakarta Sans',sans-serif}html[dir="ltr"] h1,html[dir="ltr"] h2,html[dir="ltr"] h3{font-family:'Space Grotesk',sans-serif}
.wrap{max-width:1200px;margin:auto;padding:0 22px}.hero{padding:52px 0 6px;text-align:center}.tag{display:inline-block;background:var(--badge);border:1px solid var(--border);color:var(--teal);font-size:.8rem;font-weight:700;padding:7px 16px;border-radius:999px;margin-bottom:14px}.hero h1{font-size:clamp(1.6rem,4vw,2.6rem)}.hero h1 em{font-style:normal;background:linear-gradient(135deg,var(--teal),var(--teal-deep));-webkit-background-clip:text;background-clip:text;-webkit-text-fill-color:transparent}.hero p{color:var(--mut);margin-top:10px;line-height:1.9}
.toolbar{display:flex;gap:10px;flex-wrap:wrap;justify-content:center;margin:24px 0 14px}.search{display:flex;gap:8px;align-items:center;background:var(--card);border:1px solid var(--border);border-radius:999px;padding:10px 18px;min-width:240px;flex:1;max-width:420px}.search input{flex:1;background:none;border:none;outline:none;color:var(--txt);font-size:.92rem;font-family:inherit}
.chips{display:flex;gap:8px;flex-wrap:wrap;justify-content:center}.chip{border:1px solid var(--border);background:var(--card);color:var(--mut);padding:8px 16px;border-radius:999px;font-size:.82rem;font-weight:700;cursor:pointer;font-family:inherit}.chip.active,.chip:hover{background:var(--teal);color:#04222a;border-color:var(--teal)}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(310px,1fr));gap:20px;padding:18px 0 50px}.card{background:var(--card);border:1px solid var(--border);border-radius:18px;overflow:hidden;box-shadow:var(--shadow);display:flex;flex-direction:column;transition:.25s}.card:hover{transform:translateY(-6px);border-color:var(--border-h)}.card img{width:100%;height:195px;object-fit:cover}.card-body{padding:20px;display:flex;flex-direction:column;gap:10px;flex:1}.meta{display:flex;gap:8px;font-size:.76rem;color:var(--mut);flex-wrap:wrap}.cat{background:var(--badge);color:var(--teal);border:1px solid var(--border);padding:4px 12px;border-radius:999px;font-weight:800}.card h3{font-size:1.04rem;line-height:1.7}.card p{color:var(--mut);font-size:.9rem;line-height:1.9;flex:1}.foot{display:flex;justify-content:space-between;align-items:center}.link{color:var(--teal);font-weight:800;font-size:.87rem;text-decoration:none}.link:hover{text-decoration:underline}
footer{border-top:1px solid var(--border);padding:20px;text-align:center;color:var(--mut);font-size:.85rem}
</style>

<body>
<div id="tw4a-chrome-header"></div>
<main id="tw4a-main" tabindex="-1" class="wrap">
<section class="hero"><span class="tag">Topweb4all / Blog</span>
<h1><span data-i18n="h1a">مقالات وأدلة من</span> <em data-i18n="h1b">الاستوديو</em></h1>
<p data-i18n="sub">كل المقالات تُدار من ملف واحد: data/articles.js — انسخي قالبًا واملئيه بالعربي والإنجليزي وستظهر المقالة هنا وحدها.</p></section>
<div class="toolbar"><div class="search"><span aria-hidden="true">🔍</span><label class="sr-only" for="q" data-i18n="searchLbl">ابحثي في المقالات</label><input id="q" type="search" data-i18n-ph="ph" data-i18n-aria="searchLbl" placeholder="ابحثي…" aria-describedby="tw4aCount"></div></div>
<div class="chips" id="chips" role="group" data-i18n="filterLbl" data-i18n-aria="filterLbl" aria-label="Filter by category"></div>

<div class="grid" id="grid"></div>
</main>
<noscript>
<section style="max-width:1200px;margin:24px auto;padding:0 22px;line-height:2">
  <h2>المقالات / Articles</h2>
  <ul>
    <li><a href="article.html?id=zero-to-one-brand-checklist">قائمة البراند من الصفر / Zero-to-One Brand Checklist</a></li>
    <li><a href="article.html?id=subsecond-loads-win-deals">سرعة التحميل وكسب الصفقات / Sub-Second Loads</a></li>
    <li><a href="article.html?id=spf-dkim-dmarc-inbox">SPF وDKIM وDMARC / Email Deliverability</a></li>
    <li><a href="article.html?id=kill-manual-crm-work">أتمتة CRM / CRM Automation</a></li>
    <li><a href="article.html?id=140-check-qa-sweep">فحص الجودة 140 نقطة / 140-Check QA</a></li>

  </ul>
</section>

<div id="tw4a-chrome-footer"></div>
<script src="assets/chrome.js"></script>
<script src="data/articles.js"></script>
<script>
const CATL={en:{all:'All',brand:'Branding',web:'Web',email:'Emails',auto:'Automation',qa:'QA',launch:'Launch'},ar:{all:'الكل',brand:'البراند',web:'المواقع',email:'الإيميلات',auto:'الأتمتة',qa:'الجودة',launch:'الإطلاق'}};
const STR={en:{h1a:'Guides from',h1b:'the studio',sub:'Every article is managed from one file: data/articles.js — copy a template, fill EN + AR, and it appears here automatically.',ph:'Search…',home:'← Home',work:'Projects'},ar:{h1a:'مقالات وأدلة من',h1b:'الاستوديو',sub:'كل المقالات تُدار من ملف واحد: data/articles.js — انسخي قالبًا واملئيه بالعربي والإنجليزي وستظهر المقالة هنا وحدها.',ph:'ابحثي…',home:'← الرئيسية',work:'المشاريع'}};
let lang=localStorage.getItem('tw4a-lang')||'ar',cat='all',q='';
function applyLang(l){lang=l;localStorage.setItem('tw4a-lang',l);document.documentElement.lang=l;document.documentElement.dir=l==='ar'?'rtl':'ltr';document.querySelectorAll('[data-i18n]').forEach(e=>{if(STR[l][e.dataset.i18n])e.textContent=STR[l][e.dataset.i18n]});document.querySelectorAll('[data-i18n-ph]').forEach(e=>{if(STR[l][e.dataset.i18nPh])e.placeholder=STR[l][e.dataset.i18nPh]});renderChips();renderGrid();}
function renderChips(){const c=['all','brand','web','email','auto','qa','launch'];const b=document.getElementById('chips');b.innerHTML='';c.forEach(k=>{const x=document.createElement('button');x.className='chip'+(cat===k?' active':'');x.textContent=CATL[lang][k];x.onclick=()=>{cat=k;renderChips();renderGrid()};b.appendChild(x)})}
function esc(s){return String(s).replace(/[&<>"\']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;","\"":"&quot;","\'":"&#39;"}[c]))}
function renderGrid(){const list=(window.TW4A_ARTICLES||[]).filter(a=>(cat==='all'||a.cat===cat)&&(!q||(a.title_en+a.title_ar+a.excerpt_en+a.excerpt_ar).toLowerCase().includes(q.toLowerCase())));document.getElementById('grid').innerHTML=list.map(a=>`<div class="card"><img loading="lazy" decoding="async" width="900" height="520" src="${a.cover}" alt=""><div class="card-body"><div class="meta"><span class="cat">${CATL[lang][a.cat]||a.cat}</span><span>${lang==='ar'?a.date_ar:a.date_en}</span></div><h3>${lang==='ar'?a.title_ar:a.title_en}</h3><p>${lang==='ar'?a.excerpt_ar:a.excerpt_en}</p><div class="foot"><span></span><a class="link" href="article.html?id=${a.slug}" aria-label="${esc(lang==='ar'?a.title_ar:a.title_en)}">${lang==='ar'?'اقرأ المقال ←':'Read article →'}</a></div></div></div>`).join('')||`<p style="color:var(--mut);text-align:center">${lang==='ar'?'لا نتائج.':'No results.'}</p>`
const cnt=document.getElementById('tw4aCount');if(cnt)cnt.textContent=(lang==='ar'?'عدد النتائج: ':'Results: ')+list.length;}
document.getElementById('q').addEventListener('input',e=>{q=e.target.value;renderGrid()});


document.documentElement.dataset.theme=localStorage.getItem('tw4a-theme')||'dark';
TW4A_CHROME.init({active:'blog'});
applyLang(lang);
</script>
</body>
