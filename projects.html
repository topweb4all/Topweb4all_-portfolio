<style>
:root{--teal:#00F2FE;--teal-deep:#00A896;--bg:#050D17;--card:rgba(11,24,38,.78);--header:rgba(5,13,23,.94);--border:rgba(0,242,254,.16);--border-h:rgba(0,242,254,.55);--txt:#fff;--mut:#8E9FB5;--badge:rgba(0,242,254,.08);--shadow:0 14px 40px rgba(0,0,0,.45)}
[data-theme="light"]{--bg:#EDF4F6;--card:#fff;--header:rgba(255,255,255,.96);--border:rgba(2,128,144,.28);--border-h:#028090;--txt:#0A1B29;--mut:#3D5468;--badge:rgba(2,128,144,.12);--shadow:0 12px 32px rgba(10,60,75,.14);--teal:#028090}
*{margin:0;padding:0;box-sizing:border-box;font-family:'Cairo','Plus Jakarta Sans',sans-serif}h1,h2,h3{font-family:'Cairo','Space Grotesk',sans-serif}
body{background:var(--bg);color:var(--txt)}html[dir="ltr"] *{font-family:'Plus Jakarta Sans',sans-serif}html[dir="ltr"] h1,html[dir="ltr"] h2,html[dir="ltr"] h3{font-family:'Space Grotesk',sans-serif}
.wrap{max-width:1200px;margin:auto;padding:0 22px}.hero{padding:52px 0 6px;text-align:center}.tag{display:inline-block;background:var(--badge);border:1px solid var(--border);color:var(--teal);font-size:.8rem;font-weight:700;padding:7px 16px;border-radius:999px;margin-bottom:14px}.hero h1{font-size:clamp(1.6rem,4vw,2.6rem)}.hero h1 em{font-style:normal;background:linear-gradient(135deg,var(--teal),var(--teal-deep));-webkit-background-clip:text;background-clip:text;-webkit-text-fill-color:transparent}.hero p{color:var(--mut);margin-top:10px;line-height:1.9}
.chips{display:flex;gap:8px;flex-wrap:wrap;justify-content:center;margin:24px 0 16px}.chip{border:1px solid var(--border);background:var(--card);color:var(--mut);padding:8px 18px;border-radius:999px;font-size:.83rem;font-weight:700;cursor:pointer;font-family:inherit}.chip.active,.chip:hover{background:var(--teal);color:#04222a;border-color:var(--teal)}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(320px,1fr));gap:20px;padding-bottom:50px}.card{background:var(--card);border:1px solid var(--border);border-radius:18px;overflow:hidden;box-shadow:var(--shadow);display:flex;flex-direction:column;transition:.25s}.card:hover{transform:translateY(-6px);border-color:var(--border-h)}.imgbox{position:relative}.imgbox img{width:100%;height:205px;object-fit:cover;display:block}.badge{position:absolute;top:12px;inset-inline-start:12px;background:rgba(4,20,30,.78);border:1px solid var(--border-h);color:#fff;padding:5px 13px;border-radius:999px;font-size:.74rem;font-weight:800}.card-body{padding:20px;display:flex;flex-direction:column;gap:10px;flex:1}.card h3{font-size:1.05rem;line-height:1.7}.card p{color:var(--mut);font-size:.89rem;line-height:1.9;flex:1}.pills{display:flex;gap:7px;flex-wrap:wrap}.pill{background:var(--badge);border:1px solid var(--border);color:var(--teal);font-size:.74rem;font-weight:700;padding:4px 12px;border-radius:999px}.stats{display:flex;gap:16px}.stat b{color:var(--teal);display:block;font-size:1.12rem}.stat small{color:var(--mut);font-size:.73rem}.foot{display:flex;justify-content:space-between;align-items:center}.link{color:var(--teal);font-weight:800;font-size:.87rem;text-decoration:none}
footer{border-top:1px solid var(--border);padding:20px;text-align:center;color:var(--mut);font-size:.85rem}
</style>
</head>
<body>
<div id="tw4a-chrome-header"></div>
<main id="tw4a-main" tabindex="-1" class="wrap">
<section class="hero"><span class="tag">Topweb4all / Work</span>
<h1><span data-i18n="h1a">مشاريع مختارة —</span> <em data-i18n="h1b">الدليل لا الوعود</em></h1>
<p data-i18n="sub">كل المشاريع تُدار من ملف واحد: data/projects.js — انسخي قالبًا واملئيه بالعربي والإنجليزي وسيظهر المشروع هنا وحدها.</p></section>
<div class="chips" id="chips" role="group" data-i18n="filterLbl" data-i18n-aria="filterLbl" aria-label="Filter by category"></div>
<p id="tw4aCount" class="sr-only" role="status" aria-live="polite"></p>
<div class="grid" id="grid"></div>
</main>
<noscript>
<section style="max-width:1200px;margin:24px auto;padding:0 22px;line-height:2">
  <h2>المشاريع / Projects</h2>
  <ul>
    <li><a href="project.html?id=nile-commerce-zero-to-one">نايل كوميرس / Nile Commerce</a></li>
    <li><a href="project.html?id=fintech-landing-go-live">فنتك لاندينج / Fintech Landing</a></li>
    <li><a href="project.html?id=crm-pipeline-automation">أتمتة CRM / CRM Pipeline Automation</a></li>
    <li><a href="project.html?id=clinic-brand-booking">براند عيادة / Clinic Brand</a></li>
    <li><a href="project.html?id=qa-deliverability-audit">تدقيق الجودة / QA &amp; Deliverability</a></li>
    <li><a href="project.html?id=saas-marketing-relaunch">إعادة إطلاق SaaS / SaaS Relaunch</a></li>
  </ul>
</section>
</noscript>
<div id="tw4a-chrome-footer"></div>
<script src="assets/chrome.js"></script>
<script src="data/projects.js"></script>
<script>
const CATL={en:{all:'All',brand:'Branding',web:'Web',auto:'Automation',launch:'Launch'},ar:{all:'الكل',brand:'البراند',web:'المواقع',auto:'الأتمتة',launch:'الإطلاق'}};
const STR={en:{h1a:'Selected work —',h1b:'proof, not promises',sub:'Every project is managed from one file: data/projects.js — copy a template, fill EN + AR, and it appears here automatically.',home:'← Home',blog:'Articles'},ar:{h1a:'مشاريع مختارة —',h1b:'الدليل لا الوعود',sub:'كل المشاريع تُدار من ملف واحد: data/projects.js — انسخي قالبًا واملئيه بالعربي والإنجليزي وسيظهر المشروع هنا وحدها.',home:'← الرئيسية',blog:'المقالات'}};
let lang=localStorage.getItem('tw4a-lang')||'ar',cat='all';
function applyLang(l){lang=l;localStorage.setItem('tw4a-lang',l);document.documentElement.lang=l;document.documentElement.dir=l==='ar'?'rtl':'ltr';document.querySelectorAll('[data-i18n]').forEach(e=>{if(STR[l][e.dataset.i18n])e.textContent=STR[l][e.dataset.i18n]});renderChips();renderGrid();}
function renderChips(){const c=['all','brand','web','auto','launch'];const b=document.getElementById('chips');b.innerHTML='';c.forEach(k=>{const x=document.createElement('button');x.className='chip'+(cat===k?' active':'');x.textContent=CATL[lang][k];x.onclick=()=>{cat=k;renderChips();renderGrid()};b.appendChild(x)})}
function esc(s){return String(s).replace(/[&<>"\']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;","\"":"&quot;","\'":"&#39;"}[c]))}
function renderGrid(){const list=(window.TW4A_PROJECTS||[]).filter(p=>cat==='all'||p.cats.includes(cat));document.getElementById('grid').innerHTML=list.map(p=>`<div class="card"><div class="imgbox"><img loading="lazy" decoding="async" width="1000" height="560" src="${p.cover}" alt=""><span class="badge">${p.cats.map(c=>CATL[lang][c]).join(' • ')}</span></div><div class="card-body"><h3>${lang==='ar'?p.title_ar:p.title_en}</h3><p>${lang==='ar'?p.excerpt_ar:p.excerpt_en}</p><div class="pills">${p.stack.slice(0,3).map(s=>`<span class="pill">${s}</span>`).join('')}</div><div class="stats">${p.stats.map(s=>`<div class="stat"><b>${s.v}</b><small>${lang==='ar'?s.l_ar:s.l_en}</small></div>`).join('')}</div><div class="foot"><small style="color:var(--mut)">${lang==='ar'?p.timeline_ar:p.timeline_en} • ${p.year}</small><a class="link" href="project.html?id=${p.slug}" aria-label="${esc(lang==='ar'?p.title_ar:p.title_en)}">${lang==='ar'?'عرض دراسة الحالة ←':'View case study →'}</a></div></div></div>`).join('');
const cnt=document.getElementById('tw4aCount');if(cnt)cnt.textContent=(lang==='ar'?'عدد المشاريع: ':'Projects: ')+list.length}


document.documentElement.dataset.theme=localStorage.getItem('tw4a-theme')||'dark';TW4A_CHROME.init({active:'work'});applyLang(lang);
</script>
</body>
</html>
